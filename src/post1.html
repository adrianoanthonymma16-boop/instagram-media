<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#0D1017;
    --fundo-suave:#171C26;
    --acento:#777AAD;
    --acento-forte:#8F91BF;
    --borda:#272E3B;
    --texto:#EDEEF6;
    --texto-corpo:#C4C7D6;
    --texto-suave:#8F94A8;
    --mono:'JetBrains Mono',monospace;
    --corpo:'Inter','Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{
    background:var(--fundo);
    font-family:var(--corpo);
    color:var(--texto);
    display:flex;
    flex-direction:column;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .barra{
    height:14px;
    background:linear-gradient(90deg,var(--acento),var(--acento-forte),var(--acento));
    flex:none;
  }
  .conteudo{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:76px 84px 74px;
  }
  .olho{
    font-family:var(--mono);
    font-size:31px;
    font-weight:700;
    color:var(--acento);
    letter-spacing:.16em;
    text-transform:uppercase;
  }
  h1{
    margin-top:52px;
    font-size:112px;
    line-height:1.03;
    font-weight:700;
    letter-spacing:-.032em;
  }
  .stats{
    margin-top:66px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:26px;
  }
  .stat{
    background:var(--fundo-suave);
    border:1px solid var(--borda);
    border-radius:20px;
    padding:38px 34px 34px;
  }
  .stat .num{
    font-size:118px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.04em;
    font-family:var(--mono);
    color:var(--texto);
  }
  .stat .rot{
    margin-top:18px;
    font-family:var(--mono);
    font-size:27px;
    font-weight:500;
    color:var(--texto-suave);
    letter-spacing:.05em;
  }
  .corpo{
    margin-top:60px;
    font-size:35px;
    line-height:1.5;
    color:var(--texto-corpo);
    max-width:880px;
    font-weight:400;
  }
  .pe{
    margin-top:auto;
    padding-top:44px;
    border-top:1px solid var(--borda);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .pe .url{
    font-family:var(--mono);
    font-size:33px;
    font-weight:700;
    color:var(--acento-forte);
    letter-spacing:.02em;
  }
  .pe .tag{
    font-family:var(--mono);
    font-size:26px;
    font-weight:500;
    color:var(--texto-suave);
    letter-spacing:.1em;
    text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="barra"></div>
  <div class="conteudo">
    <div class="olho">// como-votei</div>

    <h1>Como esse<br>parlamentar<br>votou?</h1>

    <div class="stats">
      <div class="stat">
        <div class="num">513</div>
        <div class="rot">deputados federais</div>
      </div>
      <div class="stat">
        <div class="num">81</div>
        <div class="rot">senadores</div>
      </div>
    </div>

    <p class="corpo">Sincronizado todo dia com as APIs oficiais da Câmara e do Senado. Você busca pelo nome, pelo estado ou pela votação.</p>

    <div class="pe">
      <div class="url">como-votei.vercel.app</div>
      <div class="tag">dados abertos</div>
    </div>
  </div>
</body>
</html>
